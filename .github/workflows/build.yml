name: Build Windows desktop app

on:
  push:
    branches: [main, rewrite/dotnet-wpf]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\TestCommander.sln
      - name: Build
        run: dotnet build .\TestCommander.sln --configuration Release --no-restore
