name: Build and test Windows desktop app

on:
  push:
    branches: [main, rewrite/dotnet-wpf]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\TestCommander.sln
      - name: Build
        run: dotnet build .\TestCommander.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test .\TestCommander.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory .\TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
